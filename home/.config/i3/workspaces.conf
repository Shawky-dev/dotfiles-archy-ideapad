# =========================================================
# Monitor definitions
# =========================================================

set $primary HDMI-A-0
set $secondary eDP

# =========================================================
# Workspace → monitor mapping
# =========================================================

# Primary monitor workspaces
workspace 1 output $primary
workspace 2 output $primary
workspace 3 output $primary
workspace 4 output $primary
workspace 5 output $primary
workspace 6 output $primary
workspace 7 output $primary
workspace 8 output $primary
workspace 9 output $primary

# Secondary monitor workspaces
workspace 10 output $secondary
workspace 11 output $secondary
workspace 12 output $secondary
workspace 13 output $secondary
workspace 14 output $secondary
workspace 15 output $secondary
workspace 16 output $secondary
workspace 17 output $secondary
workspace 18 output $secondary
workspace 19 output $secondary

# =========================================================
# Workspace variables
# =========================================================

set $ws1  "1"
set $ws2  "2"
set $ws3  "3"
set $ws4  "4"
set $ws5  "5"
set $ws6  "6"
set $ws7  "7"
set $ws8  "8"
set $ws9  "9"
set $ws10 "10"

set $ws11 "11"
set $ws12 "12"
set $ws13 "13"
set $ws14 "14"
set $ws15 "15"
set $ws16 "16"
set $ws17 "17"
set $ws18 "18"
set $ws19 "19"

# =========================================================
# PRIMARY monitor bindings (Super + number)
# =========================================================

# Switch workspace
bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5
bindsym $mod+6 workspace number $ws6
bindsym $mod+7 workspace number $ws7
bindsym $mod+8 workspace number $ws8
bindsym $mod+9 workspace number $ws9
bindsym $mod+0 workspace number $ws10

# Move container
bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5
bindsym $mod+Shift+6 move container to workspace number $ws6
bindsym $mod+Shift+7 move container to workspace number $ws7
bindsym $mod+Shift+8 move container to workspace number $ws8
bindsym $mod+Shift+9 move container to workspace number $ws9
bindsym $mod+Shift+0 move container to workspace number $ws10

# =========================================================
# SECONDARY monitor bindings (Caps Lock + number)
# =========================================================

# Switch workspace
bindsym Mod3+1 workspace number $ws11
bindsym Mod3+2 workspace number $ws12
bindsym Mod3+3 workspace number $ws13
bindsym Mod3+4 workspace number $ws14
bindsym Mod3+5 workspace number $ws15
bindsym Mod3+6 workspace number $ws16
bindsym Mod3+7 workspace number $ws17
bindsym Mod3+8 workspace number $ws18
bindsym Mod3+9 workspace number $ws19

# Move container
bindsym Mod3+Shift+1 move container to workspace number $ws11
bindsym Mod3+Shift+2 move container to workspace number $ws12
bindsym Mod3+Shift+3 move container to workspace number $ws13
bindsym Mod3+Shift+4 move container to workspace number $ws14
bindsym Mod3+Shift+5 move container to workspace number $ws15
bindsym Mod3+Shift+6 move container to workspace number $ws16
bindsym Mod3+Shift+7 move container to workspace number $ws17
bindsym Mod3+Shift+8 move container to workspace number $ws18
bindsym Mod3+Shift+9 move container to workspace number $ws19

# =========================================================
# Monitor focus bindings
# =========================================================

# Focus outputs
bindsym $mod+Control+h focus output $primary
bindsym $mod+Control+e focus output $secondary

# Move container between outputs
bindsym $mod+Control+Shift+h move container to output $primary
bindsym $mod+Control+Shift+e move container to output $secondary

# =========================================================
# Move entire workspace between monitors
# =========================================================

bindsym $mod+Control+Shift+m move workspace to output $primary
bindsym $mod+Alt+Control+Shift+m move workspace to output $secondary
