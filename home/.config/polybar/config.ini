# colors scheme generated by flavours
include-file = colors.ini

[variables]
bar_module_width=9
height=${env:BAR_HEIGHT:25}
accent=${colors.base08}
dimmed=${colors.base03}

[global/wm]
margin-top=${variables.height}

[bar/top]
monitor = ${env:MONITOR:}

; --- FLOATING SETTINGS ---
width = 98%
height = ${variables.height}
offset-x = 0.6%
offset-y = 3pt
radius = 9
fixed-center = true

; --- BORDER (Optional: adds more "air" around the bar) ---
border-size = 2pt
border-color = ${colors.base00}

background = ${colors.base00}
foreground = ${colors.base05}
padding = 2
module-margin = 1

; Iosevka matches kitty, rofi and dunst
font-0 = Iosevka Nerd Font Mono:size=10:antialias=true;2
font-1 = Iosevka Nerd Font Mono:size=6;1
font-2 = Symbols Nerd Font:size=10;2
font-3 = Symbols Nerd Font:size=10;2
font-4 = Symbols Nerd Font:size=10;2
font-5 = Noto Sans Arabic UI:size=10;

modules-left = i3 mpris-prev mpris-play-pause mpris-next mpris-song 
modules-center = date memory cpu temperature
modules-right = updates github dnd keyboard pulseaudio backlight battery bluetooth wireless-network

enable-ipc = true

; --- i3 FLOATING FIXES ---
; override-redirect = true tells i3 NOT to take control of the bar, 
; which allows the offset-y (floating) to work.
override-redirect = true
wm-restack = i3

dpi=${xrdb:Xft.dpi:96}

; Same bar plus the tray (keep modules-right in sync with bar/top);
; launch.sh uses it on the primary monitor
; (only one bar can own the tray).
[bar/top-primary]
inherit = bar/top
modules-right = updates github dnd keyboard pulseaudio backlight battery bluetooth wireless-network tray

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 99
low-at = 15

; Wrap everything in an action tag for the click-to-script functionality
format-charging = %{A1:~/.config/rofi/scripts/power-modes.sh:}%{T4}<animation-charging>%{T-} <label-charging>%{A}
format-discharging = %{A1:~/.config/rofi/scripts/power-modes.sh:}%{T4}<ramp-capacity>%{T-} <label-discharging>%{A}
format-full = %{A1:~/.config/rofi/scripts/power-modes.sh:}%{T4}<ramp-capacity>%{T-} <label-full>%{A}
format-low = %{A1:~/.config/rofi/scripts/power-modes.sh:}<label-low> %{T4}<animation-low>%{T-}%{A}

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-low = %percentage%%
; label-low-foreground = ${variables.accent}

; --- Your Custom Icons ---

; Charging state (animation)
animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰢝
; animation-charging-foreground = ${variables.accent}
animation-charging-framerate = 750

; Discharging state (ramp)
ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁾
ramp-capacity-4 = 󰂁
; ramp-capacity-foreground = ${variables.accent}

; Low battery warning (animation)
animation-low-0 = 󰂎
animation-low-1 = 󰁺
animation-low-foreground = ${variables.accent}
animation-low-framerate = 500

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
pin-workspaces = true

label-focused = %index%
label-focused-foreground = ${colors.base07}
label-focused-background = ${variables.accent}
label-focused-padding = 1
label-visible = %index%
label-visible-padding = 1
label-unfocused = %index%
label-unfocused-foreground = ${variables.dimmed}
label-unfocused-padding = 1
label-urgent = %index%
label-urgent-foreground = ${colors.base09}
label-urgent-padding = 1
label-mode = %mode%
label-mode-foreground = ${variables.accent}
label-mode-padding = 1

[module/cpu]
type = internal/cpu
interval = 2

format = <label>
label = %{T4}%{T-} %percentage%%

[module/date]
type = internal/date
interval = 1.0
date = %{A3:~/.config/polybar/scripts/polybar-calendar.sh:} %I:%M %p%{A}
date-alt = %{A3:~/.config/polybar/scripts/polybar-calendar.sh:} %d/%m/%y%{A}

[module/memory]
type = internal/memory
interval = 5

format = <label>
label = %{T4}%{T-} %percentage_used%%

[module/mpris-song]
type = custom/script
tail = true
exec = $HOME/.config/polybar/scripts/mpris-song.py
label = %output%
click-left = playerctl play-pause
scroll-up = playerctl volume 0.05+
scroll-down = playerctl volume 0.05-

[module/mpris-play-pause]
type = custom/script
tail = true
label = %{T4}%output%%{T-}
exec = $HOME/.config/polybar/scripts/mpris-status-icon.sh
click-left = playerctl play-pause

[module/mpris-prev]
type = custom/ipc
hook-0 = echo ""
hook-1 = echo "%{T3}%{T-}"
initial = 0
click-left = playerctl previous

[module/mpris-next]
type = custom/ipc
hook-0 = echo ""
hook-1 = echo "%{T3}%{T-}"
initial = 0
click-left = playerctl next

[module/wireless-network]
type = internal/network
interface-type = wireless
interval = 5.0
ping-interval = 5
format-connected = %{T3}%{T-} <label-connected>
label-connected = %essid%
label-disconnected = ""
label-disconnected-foreground = #66
animation-packetloss-0 = 
animation-packetloss-0-foreground = ${variables.accent}
animation-packetloss-1 = 
animation-packetloss-1-foreground = ${bar/top.foreground}
animation-packetloss-framerate = 500

[module/pulseaudio]
type = internal/pulseaudio
format-volume = %{T4}<ramp-volume>%{T-} <label-volume>
label-volume = %percentage%%
label-muted = %{T4}%{T-} muted
label-muted-foreground = ${variables.dimmed}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

; Open full mixer instead of adjusting volume
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = pavucontrol &

[module/updates]
type = custom/script
exec = $HOME/.config/polybar/scripts/updates-arch-combined.sh
label = %{T4}%{T-} %output%
click-left = kitty --class float --hold -e yay &
interval = 3600

[module/bluetooth]
type = custom/script
exec = $HOME/.config/polybar/scripts/bluetooth-status.sh
label = %{T3}%{T-} %output%
click-left = blueberry &
interval = 5

[module/temperature]
type = internal/temperature
interval = 5
thermal-zone = 0
hwmon-path = ${env:CPU_TEMP:}
warn-temperature = 80
units = true
format = %{T3}<ramp>%{T-} <label>
format-warn = %{T3}<ramp>%{T-} <label-warn>
label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${variables.accent}
ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-3 = 
ramp-4 = 
base-temperature = 40

[module/tray]
type = internal/tray
tray-size = 16
tray-spacing = 2
tray-background = ${colors.base00}

[module/github]
; Unread GitHub notifications via the gh CLI login (no token file)
type = custom/script
exec = n=$(gh api notifications --jq length 2>/dev/null); [ "$n" -gt 0 ] 2>/dev/null && echo "$n" || echo ""
interval = 300
label = %{T5}%{T-} %output%
click-left = xdg-open https://github.com/notifications &

[module/dnd]
; Pause/resume dunst notifications
type = custom/script
exec = [ "$(dunstctl is-paused)" = true ] && echo "%{F#962b1f}󰂛%{F-}" || echo "󰂚"
interval = 2
label = %{T3}%output%%{T-}
click-left = dunstctl set-paused toggle

[module/keyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = caps lock
blacklist-2 = scroll lock
format = <label-layout>
label-layout = %{T3}󰌌%{T-} %icon%
layout-icon-default = %layout%
layout-icon-0 = us;EN
layout-icon-1 = ara;AR

[module/backlight]
type = internal/backlight
card = amdgpu_bl1
use-actual-brightness = true
; polybar can't write the backlight file itself, so scroll via brightnessctl like the i3 keys
enable-scroll = false
format = %{A4:brightnessctl -q set 5%+:}%{A5:brightnessctl -q --min-value=1 set 5%-:}%{T3}<ramp>%{T-} <label>%{A}%{A}
label = %percentage%%
ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠
