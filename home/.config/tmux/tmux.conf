# enable mouse
set -g mouse on

# increase scrollback
set -g history-limit 10000

# use vim keys in copy mode
set -g mode-keys vi

# faster escape
set -sg escape-time 0

# Prefix: Caps Lock + Space
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'
set -g @plugin 'z3z1ma/tmux-gruvbox'

set -g @gruvbox_window_default_text "#W"
set -g @gruvbox_window_current_text "#W"



# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# copy to clipboard on mouse release, but keep the highlight
# (must come after tpm, otherwise tmux-yank overrides it)
set -g set-clipboard on
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "xclip -selection clipboard"
